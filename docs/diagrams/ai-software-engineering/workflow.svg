<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 662" width="760" height="662" role="img" aria-labelledby="title description">
<title id="title">Gesamtworkflow nach Matt Pocock</title><desc id="description">Menschliches Alignment und Ticketplanung, parallele Agenten, Tests, Review und Retrospektive mit Rückkopplung.</desc>
<style>
svg{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#fbfcff;--ink:#233248;--muted:#52647b;--border:#d8e1ed;--blue:#3978d2;--blue-bg:#eaf2ff;--purple:#8155c7;--purple-bg:#f2ebff;--green:#25865a;--green-bg:#e5f6ec;--amber:#a66813;--amber-bg:#fff4df;--red:#b64e55;--red-bg:#fcebed;--neutral:#f0f3f8;--arrow:#718299}
@media(prefers-color-scheme:dark){svg{--bg:#181c25;--ink:#edf2fb;--muted:#b6c2d4;--border:#384356;--blue:#8ab4f8;--blue-bg:#243652;--purple:#bca0fa;--purple-bg:#392c50;--green:#82d8a7;--green-bg:#233d32;--amber:#f1c477;--amber-bg:#433622;--red:#f5a0a6;--red-bg:#432b34;--neutral:#273140;--arrow:#a5b3c6}}
text{fill:var(--ink);font-size:17px}.label{font-weight:650}.small{font-size:14px;fill:var(--muted)}.heading{font-size:21px;font-weight:700}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1.3px}.note{font-size:15px;font-weight:650}.canvas{fill:var(--bg);stroke:var(--border);stroke-width:1.4}.neutral{fill:var(--neutral);stroke:var(--border);stroke-width:1.5}
.blue,.purple,.green,.amber,.red{stroke-width:1.5}.blue{fill:var(--blue-bg);stroke:var(--blue)}.purple{fill:var(--purple-bg);stroke:var(--purple)}.green{fill:var(--green-bg);stroke:var(--green)}.amber{fill:var(--amber-bg);stroke:var(--amber)}.red{fill:var(--red-bg);stroke:var(--red)}
.group-blue,.group-purple,.group-green{stroke-width:1.2;fill-opacity:.48}.group-blue{fill:var(--blue-bg);stroke:var(--blue)}.group-purple{fill:var(--purple-bg);stroke:var(--purple)}.group-green{fill:var(--green-bg);stroke:var(--green)}
.blue-text{fill:var(--blue)}.purple-text{fill:var(--purple)}.green-text{fill:var(--green)}.red-text{fill:var(--red)}
.arrow,.connector,.feedback{fill:none;stroke:var(--arrow);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.arrow{marker-end:url(#arrow)}.feedback{stroke:var(--green);stroke-dasharray:5 5;marker-end:url(#greenArrow)}.dash{fill:none;stroke:var(--arrow);stroke-width:1.4;stroke-dasharray:5 4}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--arrow)"/></marker><marker id="greenArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--green)"/></marker></defs>
<rect x="1" y="1" width="758" height="660" rx="20" class="canvas"/><rect x="24" y="24" width="712" height="218" rx="16" class="group-blue"/><text x="44" y="48" class="eyebrow blue-text" text-anchor="start">01  HUMAN IN THE LOOP</text><rect x="185" y="61" width="390" height="42" rx="12" class="blue"/><text x="380" y="87" class="label" text-anchor="middle">Alignment / Grill me</text><path d="M380 103 V116" class="arrow"/><rect x="185" y="117" width="390" height="42" rx="12" class="blue"/><text x="380" y="143" class="label" text-anchor="middle">Glossar, ADRs und Prototypen</text><path d="M380 159 V172" class="arrow"/><rect x="185" y="173" width="390" height="42" rx="12" class="blue"/><text x="380" y="199" class="label" text-anchor="middle">PRD und Ticketplanung (DAG)</text><rect x="24" y="260" width="712" height="203" rx="16" class="group-purple"/><text x="44" y="284" class="eyebrow purple-text" text-anchor="start">02  AUTONOME AFK-PHASE</text><path d="M380 215 V289 H152 V305" class="arrow"/><path d="M380 289 V305" class="arrow"/><path d="M380 289 H608 V305" class="arrow"/><rect x="59" y="306" width="186" height="56" rx="12" class="purple"/><text x="152" y="329" class="label" text-anchor="middle">Agent A</text><text x="152" y="350" class="small" text-anchor="middle">Worktree 1</text><path d="M152 362 V379 H380" class="connector"/><rect x="287" y="306" width="186" height="56" rx="12" class="purple"/><text x="380" y="329" class="label" text-anchor="middle">Agent B</text><text x="380" y="350" class="small" text-anchor="middle">Worktree 2</text><path d="M380 362 V379 H380" class="connector"/><rect x="515" y="306" width="186" height="56" rx="12" class="purple"/><text x="608" y="329" class="label" text-anchor="middle">Agent C</text><text x="608" y="350" class="small" text-anchor="middle">Worktree 3</text><path d="M608 362 V379 H380" class="connector"/><path d="M380 379 V393" class="arrow"/><rect x="185" y="394" width="390" height="52" rx="12" class="purple"/><text x="380" y="415" class="label" text-anchor="middle">Red → Green → Refactor</text><text x="380" y="436" class="small" text-anchor="middle">Tests · Typecheck · Lint</text><rect x="24" y="481" width="712" height="157" rx="16" class="group-green"/><text x="44" y="505" class="eyebrow green-text" text-anchor="start">03  REVIEW UND VERBESSERUNG</text><path d="M380 446 V515" class="arrow"/><rect x="185" y="516" width="390" height="42" rx="12" class="green"/><text x="380" y="542" class="label" text-anchor="middle">Code Review und Merge</text><path d="M380 558 V571" class="arrow"/><rect x="185" y="572" width="390" height="42" rx="12" class="green"/><text x="380" y="598" class="label" text-anchor="middle">Retro → Regeln und Skills</text><path d="M575 593 H708 V82 H575" class="feedback"/>
</svg>
