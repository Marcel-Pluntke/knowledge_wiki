<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" width="760" height="355" role="img" aria-labelledby="title description">
<title id="title">Horizontale Schichten vs. vertikale Slices</title><desc id="description">Links werden Schichten einzeln fertiggestellt; rechts umfasst jeder Slice UI, API, Service und Datenbank.</desc>
<style>
svg{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#fbfcff;--ink:#233248;--muted:#52647b;--border:#d8e1ed;--blue:#3978d2;--blue-bg:#eaf2ff;--purple:#8155c7;--purple-bg:#f2ebff;--green:#25865a;--green-bg:#e5f6ec;--amber:#a66813;--amber-bg:#fff4df;--red:#b64e55;--red-bg:#fcebed;--neutral:#f0f3f8;--arrow:#718299}
@media(prefers-color-scheme:dark){svg{--bg:#181c25;--ink:#edf2fb;--muted:#b6c2d4;--border:#384356;--blue:#8ab4f8;--blue-bg:#243652;--purple:#bca0fa;--purple-bg:#392c50;--green:#82d8a7;--green-bg:#233d32;--amber:#f1c477;--amber-bg:#433622;--red:#f5a0a6;--red-bg:#432b34;--neutral:#273140;--arrow:#a5b3c6}}
text{fill:var(--ink);font-size:17px}.label{font-weight:650}.small{font-size:14px;fill:var(--muted)}.heading{font-size:21px;font-weight:700}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1.3px}.note{font-size:15px;font-weight:650}.canvas{fill:var(--bg);stroke:var(--border);stroke-width:1.4}.neutral{fill:var(--neutral);stroke:var(--border);stroke-width:1.5}
.blue,.purple,.green,.amber,.red{stroke-width:1.5}.blue{fill:var(--blue-bg);stroke:var(--blue)}.purple{fill:var(--purple-bg);stroke:var(--purple)}.green{fill:var(--green-bg);stroke:var(--green)}.amber{fill:var(--amber-bg);stroke:var(--amber)}.red{fill:var(--red-bg);stroke:var(--red)}
.group-blue,.group-purple,.group-green{stroke-width:1.2;fill-opacity:.48}.group-blue{fill:var(--blue-bg);stroke:var(--blue)}.group-purple{fill:var(--purple-bg);stroke:var(--purple)}.group-green{fill:var(--green-bg);stroke:var(--green)}
.blue-text{fill:var(--blue)}.purple-text{fill:var(--purple)}.green-text{fill:var(--green)}.red-text{fill:var(--red)}
.arrow,.connector,.feedback{fill:none;stroke:var(--arrow);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.arrow{marker-end:url(#arrow)}.feedback{stroke:var(--green);stroke-dasharray:5 5;marker-end:url(#greenArrow)}.dash{fill:none;stroke:var(--arrow);stroke-width:1.4;stroke-dasharray:5 4}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--arrow)"/></marker><marker id="greenArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--green)"/></marker></defs>
<rect x="1" y="1" width="758" height="353" rx="20" class="canvas"/><text x="209" y="40" class="heading" text-anchor="middle">Horizontale Schichten</text><text x="557" y="40" class="heading" text-anchor="middle">Vertikale Slices</text><text x="20" y="111" class="small" text-anchor="start">UI</text><rect x="88" y="86" width="246" height="39" rx="6" class="blue"/><text x="211" y="111" class="small" text-anchor="middle">UI komplett</text><rect x="407" y="86" width="90" height="39" rx="6" class="blue"/><rect x="512" y="86" width="90" height="39" rx="6" class="purple"/><rect x="617" y="86" width="90" height="39" rx="6" class="green"/><text x="20" y="165" class="small" text-anchor="start">API</text><rect x="88" y="140" width="246" height="39" rx="6" class="purple"/><text x="211" y="165" class="small" text-anchor="middle">API komplett</text><rect x="407" y="140" width="90" height="39" rx="6" class="blue"/><rect x="512" y="140" width="90" height="39" rx="6" class="purple"/><rect x="617" y="140" width="90" height="39" rx="6" class="green"/><text x="20" y="219" class="small" text-anchor="start">Service</text><rect x="88" y="194" width="246" height="39" rx="6" class="amber"/><text x="211" y="219" class="small" text-anchor="middle">Service komplett</text><rect x="407" y="194" width="90" height="39" rx="6" class="blue"/><rect x="512" y="194" width="90" height="39" rx="6" class="purple"/><rect x="617" y="194" width="90" height="39" rx="6" class="green"/><text x="20" y="273" class="small" text-anchor="start">DB</text><rect x="88" y="248" width="246" height="39" rx="6" class="green"/><text x="211" y="273" class="small" text-anchor="middle">DB komplett</text><rect x="407" y="248" width="90" height="39" rx="6" class="blue"/><rect x="512" y="248" width="90" height="39" rx="6" class="purple"/><rect x="617" y="248" width="90" height="39" rx="6" class="green"/><rect x="401" y="76" width="102" height="221" rx="10" class="dash"/><text x="452" y="66" class="small" text-anchor="middle">Slice 1</text><rect x="506" y="76" width="102" height="221" rx="10" class="dash"/><text x="557" y="66" class="small" text-anchor="middle">Slice 2</text><rect x="611" y="76" width="102" height="221" rx="10" class="dash"/><text x="662" y="66" class="small" text-anchor="middle">Slice 3</text><text x="211" y="330" class="note red-text" text-anchor="middle">Späte Integration</text><text x="557" y="330" class="note green-text" text-anchor="middle">Frühes Feedback je Slice</text>
</svg>
